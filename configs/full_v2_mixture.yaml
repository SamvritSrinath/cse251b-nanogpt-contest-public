name: full_v2_mixture_template

architecture:
  name: modern_decoder
  n_layer: 16
  d_model: 640
  n_heads: 10
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 0.75
      notes: 'Primary educational web corpus from HuggingFaceFW/fineweb-edu.'
    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.15
      notes: 'Template slot for OpenWebText-style general web data.'
    - name: wikimedia
      path: data/wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.09
      notes: 'Template slot for Wikipedia or Wikimedia-derived text.'
    # - name: stackexchange
    #   path: data/stackexchange
    #   glob: "**/*_train_*.bin"
    #   weight: 0.03
    #   notes: 'Template slot for StackExchange-style conversational technical data.'
    - name: arxiv_abstracts
      path: data/arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.01
      notes: 'Template slot for technical/reference abstracts.'
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests

train:
  max_steps: 15000
  batch_size: 16
  grad_accum_steps: 6
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 8
  eval_batches: null
  seed: 1337
  device: cuda
  compile: false
  precision: bf16
  log_cuda_memory: true
  warmup_steps: 100
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: fixed
    end_context_len: 1024
