name: small

architecture:
  name: modern_decoder
  n_layer: 8
  d_model: 384
  n_heads: 6
  ffn_multiplier: 2.67
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 1.0
      notes: "Primary educational web corpus from HuggingFaceFW/fineweb-edu."
  val_data_path: val.bin
  data_fraction: 10%
  manifest_dir: data/manifests

train:
  max_steps: 2000
  batch_size: 8
  grad_accum_steps: 2
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 200
  save_interval: 200
  eval_batch_size: 8
  eval_batches: 16
  seed: 1337
  device: cuda
  compile: false
  warmup_steps: 20
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: fixed
    end_context_len: 1024
