name: full_v25_projected_multidomain_gold

architecture:
  name: projected_modern_decoder
  n_layer: 12
  embedding_dim: 256
  d_model: 768
  n_heads: 12
  ffn_multiplier: 2.67
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0
  qk_norm: true
  residual_init: scaled

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 0.58
      sample_policy: random_window

    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.14
      sample_policy: random_window

    - name: commonpile_wikimedia
      path: data/commonpile-wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.10
      sample_policy: document_window

    - name: arxiv_abstracts
      path: data/commonpile-arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.06
      sample_policy: random_window

    - name: pg19_books
      path: data/pg19-books
      glob: "**/*_train_*.bin"
      weight: 0.08
      sample_policy: document_window

    - name: commonpile_stackexchange
      path: data/commonpile-stackexchange
      glob: "**/*_train_*.bin"
      weight: 0.04
      sample_policy: document_window

  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests-v25-projected-multidomain

train:
  max_steps: 9000

  batch_size: 16
  grad_accum_steps: 6

  grad_clip: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 8
  eval_batches: null

  seed: 1919
  device: cuda
  compile: false
  precision: bf16

  resume_from: null

  warmup_steps: 3000
  min_lr_ratio: 0.1

  checkpoint_dir: checkpoints
  submission_dir: submission
  keep_step_checkpoints: false
  log_cuda_memory: true

  context_schedule:
    name: ramp
    start_context_len: 256
    end_context_len: 1024
    switch_step: 3000
    ramp_steps: 6000