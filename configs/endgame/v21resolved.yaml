name: full_v22_phase2_low_lr_continue

architecture:
  name: modern_decoder
  n_layer: 21
  d_model: 576
  n_heads: 9
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: muon_hybrid

  # Discovered from v21: useful region is below ~1.2e-4.
  # This run starts safely inside the region that was still improving overnight.
  adamw_lr: 0.0000003
  muon_lr: 0.00002

  weight_decay: 0.08
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 0.58
      sample_policy: random_window

    - name: commonpile_wikimedia
      path: data/commonpile-wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.12
      sample_policy: document_window

    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.16
      sample_policy: random_window

    - name: arxiv_abstracts
      path: data/commonpile-arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.08
      sample_policy: random_window

    - name: pg19_books
      path: data/pg19-books
      glob: "**/*_train_*.bin"
      weight: 0.04
      sample_policy: document_window

    - name: commonpile_stackexchange
      path: data/commonpile-stackexchange
      glob: "**/*_train_*.bin"
      weight: 0.02
      sample_policy: document_window

  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests-v22-phase2

train:
  max_steps: 72000

  batch_size: 8
  grad_accum_steps: 12

  grad_clip: 1.0
  log_interval: 50
  eval_interval: 250
  save_interval: 250
  eval_batch_size: 8
  eval_batches: null

  seed: 1353
  device: cuda
  compile: true
  precision: bf16

  resume_from: submission/20260528-042203/best
  resume_initial_step: 62000
  resume_initial_val_ppl: 23.6276

  lr_schedule_origin: resume
  warmup_steps: 200
  min_lr_ratio: 0.5

  checkpoint_dir: checkpoints
  submission_dir: submission
  keep_step_checkpoints: true
  log_cuda_memory: true

  context_schedule:
    name: fixed
    end_context_len: 1024