name: full_v19_commonpile_boot400

architecture:
  name: modern_decoder
  n_layer: 16
  d_model: 640
  n_heads: 10
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0
  qk_norm: true
  residual_init: scaled

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu_hi
      path: data/fineweb-edu-hi
      glob: "**/*_train_*.bin"
      weight: 0.50
      sample_policy: random_window
      prepare:
        kind: hf_parquet
        dataset: HuggingFaceFW/fineweb-edu
        include: "sample/10BT/*.parquet"
        revision: main
        text_column: text
        shard_prefix: fineweb_edu_hi
        filter_profile: fineweb_edu_hi
        split_mode: train-only
        emit_doc_index: false
        max_temp_gb: 40
    - name: commonpile_wikimedia
      path: data/commonpile-wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.15
      sample_policy: document_window
      prepare:
        kind: hf_stream_json
        dataset: common-pile/wikimedia_filtered
        revision: main
        shard_prefix: commonpile_wikimedia
        split_mode: train-only
        emit_doc_index: true
        max_docs: 5000000
        max_temp_gb: 40
    - name: commonpile_stackexchange
      path: data/commonpile-stackexchange
      glob: "**/*_train_*.bin"
      weight: 0.07
      sample_policy: document_window
      prepare:
        kind: hf_stream_json
        dataset: common-pile/stackexchange_filtered
        revision: main
        shard_prefix: commonpile_stackexchange
        split_mode: train-only
        emit_doc_index: true
        max_docs: 2500000
        max_temp_gb: 30
    - name: commonpile_gutenberg
      path: data/commonpile-gutenberg
      glob: "**/*_train_*.bin"
      weight: 0.15
      sample_policy: document_window
      prepare:
        kind: hf_stream_json
        dataset: common-pile/project_gutenberg_filtered
        revision: main
        shard_prefix: commonpile_gutenberg
        split_mode: train-only
        emit_doc_index: true
        max_docs: 2000000
        max_temp_gb: 30
    - name: commonpile_arxiv_abstracts
      path: data/commonpile-arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.04
      sample_policy: document_window
      prepare:
        kind: hf_stream_json
        dataset: common-pile/arxiv_abstracts_filtered
        revision: main
        shard_prefix: commonpile_arxiv_abstracts
        split_mode: train-only
        emit_doc_index: true
        max_docs: 1000000
        max_temp_gb: 15
    - name: commonpile_youtube
      path: data/commonpile-youtube
      glob: "**/*_train_*.bin"
      weight: 0.03
      sample_policy: random_window
      prepare:
        kind: hf_stream_json
        dataset: common-pile/youtube_filtered
        revision: main
        shard_prefix: commonpile_youtube
        split_mode: train-only
        emit_doc_index: true
        max_docs: 1000000
        max_temp_gb: 15
    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.06
      sample_policy: random_window
      prepare:
        kind: hf_parquet
        dataset: Skylion007/openwebtext
        include: "**/*.parquet"
        revision: main
        text_column: text
        shard_prefix: openwebtext
        split_mode: train-only
        emit_doc_index: false
        max_temp_gb: 25
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests-v19-boot400

train:
  max_steps: 22000
  batch_size: 16
  grad_accum_steps: 6
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 8
  eval_batches: null
  seed: 1346
  device: cuda
  compile: true
  precision: bf16
  warmup_steps: 400
  min_lr_ratio: 0.08
  checkpoint_dir: checkpoints
  submission_dir: submission
  keep_step_checkpoints: false
  resume_from: null  # TODO: set to a checkpoint path for continuation runs.
  context_schedule:
    name: fixed
    end_context_len: 1024
