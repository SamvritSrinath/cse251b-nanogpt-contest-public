name: c25p8_sweep_d_relative_resume

architecture:
  name: modern_decoder
  n_layer: 16
  d_model: 640
  n_heads: 10
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0
  qk_norm: false
  residual_init: default

optimizer:
  name: muon_hybrid
  adamw_lr: 0.00005
  muon_lr: 0.0035
  weight_decay: 0.08
  betas: [0.9, 0.98]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 0.88
    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.08
    - name: wikimedia
      path: data/wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.03
    - name: arxiv_abstracts
      path: data/arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.01
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests

train:
  max_steps: 31000
  batch_size: 16
  grad_accum_steps: 6
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 250
  save_interval: 250
  eval_batch_size: 8
  eval_batches: null
  seed: 1342
  device: cuda
  compile: true
  precision: bf16
  warmup_steps: 0
  min_lr_ratio: 1.0
  lr_schedule_origin: resume
  checkpoint_dir: checkpoints
  submission_dir: submission
  resume_from: submission/20260520-095531/best/checkpoint.pt
  resume_initial_step: 30000
  resume_initial_val_ppl: 25.8011
  context_schedule:
    name: fixed
    end_context_len: 1024
