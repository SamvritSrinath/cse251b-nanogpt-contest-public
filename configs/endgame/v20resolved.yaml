name: full_v21_recover_v13_broad_warmrestart

architecture:
  name: modern_decoder
  n_layer: 21
  d_model: 576
  n_heads: 9
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: muon_hybrid

  # Keep v20's conservative continuation LR, but make it safe via warm restart.
  # Do not raise LR until validation has recovered below 24.2 PPL again.
  adamw_lr: 0.0000027
  muon_lr: 0.00018

  # Slightly less destructive than 0.10 for continuation, but still regularized.
  weight_decay: 0.08

  # Prefer faster adaptation than beta2=0.98 under distribution shift.
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 0.58
      sample_policy: random_window

    - name: commonpile_wikimedia
      path: data/commonpile-wikimedia
      glob: "**/*_train_*.bin"
      weight: 0.12
      sample_policy: document_window

    - name: openwebtext
      path: data/openwebtext
      glob: "**/*_train_*.bin"
      weight: 0.16
      sample_policy: random_window

    - name: arxiv_abstracts
      path: data/commonpile-arxiv-abstracts
      glob: "**/*_train_*.bin"
      weight: 0.08
      sample_policy: random_window

    - name: pg19_books
      path: data/pg19-books
      glob: "**/*_train_*.bin"
      weight: 0.04
      sample_policy: document_window

    - name: commonpile_stackexchange
      path: data/commonpile-stackexchange
      glob: "**/*_train_*.bin"
      weight: 0.02
      sample_policy: document_window

    # - name: commonpile_youtube
    #   path: data/commonpile-youtube
    #   glob: "**/*_train_*.bin"
    #   weight: 0.00
    #   sample_policy: random_window

  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests-v21-recover

train:
  # Assuming the 24.2044 checkpoint is at/near step 52000.
  # This gives a 10k-step recovery + improvement window.
  max_steps: 62000

  # Same effective tokens as v20, but twice as many source draws per optimizer step.
  batch_size: 8
  grad_accum_steps: 12

  grad_clip: 1.0
  log_interval: 50

  # Use tighter evals during recovery; you need to detect whether the run is healing.
  eval_interval: 250
  save_interval: 250
  eval_batch_size: 8
  eval_batches: null

  seed: 1351
  device: cuda
  compile: true
  precision: bf16

  # Important: use the model-only export, not a training checkpoint with optimizer state.
  # The repo treats a directory resume path as directory/checkpoint.pt.
  resume_from: submission/20260525-222346/best.pt
  resume_initial_step: 52000
  resume_initial_val_ppl: 24.2044

  # Requires the resolve_warmup_steps patch above.
  lr_schedule_origin: resume
  warmup_steps: 500
  min_lr_ratio: 0.1

  checkpoint_dir: checkpoints
  submission_dir: submission
  keep_step_checkpoints: true
  log_cuda_memory: true

  context_schedule:
    name: fixed
    end_context_len: 1024