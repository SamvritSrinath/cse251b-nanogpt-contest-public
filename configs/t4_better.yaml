name: t4_better_46m

architecture:
  name: modern_decoder
  n_layer: 10
  d_model: 448
  n_heads: 7
  ffn_multiplier: 2.67
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: build-nanogpt/edu_fineweb10B
      glob: "**/edufineweb_train_*.npy"
      weight: 1.0
      notes: "FineWeb-Edu sample-10BT shards generated by build-nanogpt."
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests

train:
  max_steps: 6000
  batch_size: 8
  grad_accum_steps: 2
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 8
  eval_batches: 32
  seed: 1337
  device: cuda
  compile: false
  gradient_checkpointing: false
  warmup_steps: 200
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: ramp
    start_context_len: 256
    end_context_len: 1024
    switch_step: 500
    ramp_steps: 1000
