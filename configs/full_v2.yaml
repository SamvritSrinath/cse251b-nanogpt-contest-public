name: full_v2

architecture:
  name: modern_decoder
  n_layer: 16
  d_model: 640
  n_heads: 10
  ffn_multiplier: 2.00
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/edufineweb_train_*.bin"
      weight: 1.0
      notes: "Primary educational web corpus from HuggingFaceFW/fineweb-edu."
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests

train:
  max_steps: 10000
  batch_size: 24
  grad_accum_steps: 3
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 24
  eval_batches: 64
  seed: 1337
  device: cuda
  compile: false
  precision: bf16
  log_cuda_memory: true
  warmup_steps: 100
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: fixed
    end_context_len: 1024
