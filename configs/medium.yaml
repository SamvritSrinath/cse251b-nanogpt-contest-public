name: medium

architecture:
  name: modern_decoder
  n_layer: 12
  d_model: 512
  n_heads: 8
  ffn_multiplier: 2.67
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0

optimizer:
  name: muon_hybrid
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*.bin"
      weight: 1.0
      notes: "Primary educational web corpus from HuggingFaceFW/fineweb-edu."
  val_data_path: val.bin
  data_fraction: 50%
  manifest_dir: data/manifests

train:
  max_steps: 5000
  batch_size: 8
  grad_accum_steps: 4
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 500
  save_interval: 500
  eval_batch_size: 8
  eval_batches: 32
  seed: 1337
  device: cuda
  compile: false
  warmup_steps: 50
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: fixed
    end_context_len: 1024
