name: control_from_optuna_trial_0001

architecture:
  name: modern_decoder
  n_layer: 2
  d_model: 128
  n_heads: 4
  ffn_multiplier: 2.67
  context_len: 1024
  vocab_size: 50257
  weight_tying: true
  dropout: 0.0
  bias: null
  rope_base: 10000.0

optimizer:
  name: adamw
  adamw_lr: 0.0003
  muon_lr: 0.02
  weight_decay: 0.1
  betas: [0.9, 0.95]
  eps: 1.0e-8
  momentum: 0.95
  nesterov: true
  muon_ns_steps: 5

data:
  # Keep the same mixture structure as the winning smoke trial, but point to
  # full training shards instead of smoke-only paths.
  sources:
    - name: fineweb_edu
      path: data/fineweb-edu
      glob: "**/*_train_*.bin"
      weight: 1.0
      notes: "Just general data source"
    # - name: general_web
    #   path: data/general-web
    #   glob: "**/*_train_*.bin"
    #   weight: 0.1
    #   notes: ""
  val_data_path: val.bin
  data_fraction: 100%
  manifest_dir: data/manifests

train:
  # Longer control run than search trials (which were max_steps=2).
  max_steps: 3000
  batch_size: 8
  grad_accum_steps: 2
  grad_clip: 1.0
  log_interval: 20
  eval_interval: 200
  save_interval: 200
  eval_batch_size: 8
  eval_batches: 32
  seed: 1337
  device: cuda
  compile: false
  warmup_steps: 100
  min_lr_ratio: 0.1
  checkpoint_dir: checkpoints
  submission_dir: submission
  context_schedule:
    name: ramp
    start_context_len: 256
    end_context_len: 1024
    switch_step: 500
    ramp_steps: 500
