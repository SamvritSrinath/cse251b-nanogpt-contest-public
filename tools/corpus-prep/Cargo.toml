[package]
name = "corpus-prep"
version = "0.1.0"
edition = "2021"
description = "Text corpus (HF Hub or local parquet) → raw uint16 GPT-2 token shards for memmap training"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
hf-hub = "0.3"
parquet = { version = "54", default-features = false, features = ["arrow"] }
arrow-array = "54"
arrow-schema = "54"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.11"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
